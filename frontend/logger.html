<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Logger | StudyOpt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <!-- Navigation Header (Hydrated by app.js) -->
    <header></header>

    <main id="main-content">
        <div class="page-title-section">
            <h1>What Did You Actually Do?</h1>
            <p class="page-subtitle">Track your actual study patterns. The scheduler adjusts based on these entries.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 1.5rem;" id="logger-layout-grid">
            <!-- Left Form Section -->
            <div class="card">
                <h2 class="card-title">Log Study Activity</h2>
                <form id="study-logger-form">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem;">
                        <div class="form-group">
                            <label for="log-course-id">Subject Course</label>
                            <select id="log-course-id" class="form-control" required>
                                <option value="" disabled selected>loading...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="log-date">Study Date</label>
                            <input type="date" id="log-date" class="form-control" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                        <div class="form-group">
                            <label for="log-planned">Planned Hours</label>
                            <div class="slider-container">
                                <input type="range" id="log-planned" class="form-control" min="0.5" max="8" step="0.5" value="2.0">
                                <span class="slider-val" id="log-planned-val">2.0h</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="log-actual">Actual Hours Studied</label>
                            <div class="slider-container">
                                <input type="range" id="log-actual" class="form-control" min="0.5" max="8" step="0.5" value="2.0">
                                <span class="slider-val" id="log-actual-val">2.0h</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="log-focus">Focus Score (1 = distracted, 10 = flow state)</label>
                        <div class="slider-container">
                            <input type="range" id="log-focus" class="form-control" min="1" max="10" step="1" value="7">
                            <span class="slider-val" id="log-focus-val" style="color: var(--accent-secondary);">7/10</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="log-notes">Session Notes / Core Concepts Covered</label>
                        <textarea id="log-notes" class="form-control" rows="3" placeholder="Reviewed Bayes theorem, completed tutorial 3, etc."></textarea>
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="log-completed" checked style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="log-completed" style="margin-bottom: 0; cursor: pointer;">Mark session as fully completed</label>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary" style="min-width: 150px;">Log & Update</button>
                    </div>
                </form>
            </div>

            <!-- Right History Section -->
            <div class="card">
                <h2 class="card-title">Recent Study Sessions History</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Course</th>
                                <th>Planned</th>
                                <th>Actual</th>
                                <th>Focus</th>
                                <th>Status</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="logs-history-tbody">
                            <tr>
                                <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                                    loading...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div>
            StudyOpt &bull; v0.4 &bull; Built for Semester 6 chaos
        </div>
    </footer>

    <script src="app.js"></script>
    <script src="logger.js"></script>
</body>
</html>
